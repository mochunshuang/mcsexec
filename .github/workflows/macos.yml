name: macos_clang_19.1

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CMAKE_BUILD_TYPE: Release
  LLVM_VERSION: "19.1.7"
  TOOLS_DIR: "${HOME}/tools"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create tools directory
        shell: bash
        run: mkdir -p ${{env.TOOLS_DIR}}

      - name: Detect system architecture
        id: detect_arch
        shell: bash
        run: |
          ARCH=$(uname -m)
          [[ "$ARCH" == "arm64" ]] && TARGET_ARCH="ARM64" || TARGET_ARCH="X64"
          echo "LLVM_ARCH=$TARGET_ARCH" >> $GITHUB_ENV
          echo "Detected architecture: $ARCH"

      - name: Download and Install LLVM
        shell: bash
        run: |
          LLVM_DIR="${TOOLS_DIR}/llvm-${{env.LLVM_VERSION}}"
          LLVM_URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${{env.LLVM_VERSION}}/LLVM-${{env.LLVM_VERSION}}-macOS-${{env.LLVM_ARCH}}.tar.xz"

          echo "Downloading LLVM from: $LLVM_URL"
          curl -L -o llvm.tar.xz "$LLVM_URL"

          echo "Extracting LLVM to: $LLVM_DIR"
          mkdir -p "$LLVM_DIR"
          tar -xf llvm.tar.xz --strip-components=1 -C "$LLVM_DIR"

          echo "PATH=$LLVM_DIR/bin:$PATH" >> $GITHUB_PATH
          echo "LLVM_LIB_PATH=$LLVM_DIR/lib" >> $GITHUB_ENV

      - name: Verify LLVM Installation
        shell: bash
        run: clang --version

      - name: Download and Install Ninja
        shell: bash
        run: |
          NINJA_VERSION="1.12.0"
          NINJA_URL="https://github.com/ninja-build/ninja/releases/download/v${NINJA_VERSION}/ninja-mac.zip"
          curl -L -o ninja.zip "$NINJA_URL"
          unzip ninja.zip -d ${{env.TOOLS_DIR}}/ninja
          chmod +x ${{env.TOOLS_DIR}}/ninja/ninja
          echo "${{env.TOOLS_DIR}}/ninja" >> $GITHUB_PATH

      - name: Verify Ninja Installation
        shell: bash
        run: ninja --version

      - name: Download and Install CMake
        shell: bash
        run: |
          CMAKE_VERSION="3.30.0"
          CMAKE_URL="https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-macos-universal.tar.gz"
          curl -L -o cmake.tar.gz "$CMAKE_URL"
          tar -xf cmake.tar.gz -C ${{env.TOOLS_DIR}}
          mv ${{env.TOOLS_DIR}}/cmake-${CMAKE_VERSION}-macos-universal ${{env.TOOLS_DIR}}/cmake-${CMAKE_VERSION}
          echo "${{env.TOOLS_DIR}}/cmake-${CMAKE_VERSION}/CMake.app/Contents/bin" >> $GITHUB_PATH

      - name: Verify CMake Installation
        shell: bash
        run: cmake --version

      - name: Set environment variables
        run: |
          echo "LLVM_VERSION=19.1.7" >> $GITHUB_ENV
          echo "TOOLS_DIR=${HOME}/tools" >> $GITHUB_ENV
          echo "LLVM_ARCH=arm64" >> $GITHUB_ENV
          echo "LLVM_INSTALL_PREFIX=${HOME}/tools/llvm-19.1.7" >> $GITHUB_ENV
          echo "LLVM_LIB_PATH=${HOME}/tools/llvm-19.1.7/lib" >> $GITHUB_ENV

      - name: Generate llvm-toolchain.cmake
        shell: bash
        run: |
          cat << EOF > llvm-toolchain.cmake
          set(CMAKE_SYSTEM_NAME Darwin)
          set(CMAKE_SYSTEM_PROCESSOR "\${LLVM_ARCH}")
          set(CMAKE_C_COMPILER "\${LLVM_INSTALL_PREFIX}/bin/clang")
          set(CMAKE_CXX_COMPILER "\${LLVM_INSTALL_PREFIX}/bin/clang++")
          set(CMAKE_AR "\${LLVM_INSTALL_PREFIX}/bin/llvm-ar")
          set(CMAKE_RANLIB "\${LLVM_INSTALL_PREFIX}/bin/llvm-ranlib")
          set(CMAKE_LINKER "\${LLVM_INSTALL_PREFIX}/bin/ld.lld")

          set(CMAKE_CXX_FLAGS "-stdlib=libc++ -fuse-ld=lld")
          set(CMAKE_EXE_LINKER_FLAGS "-Wl,-rpath,\${LLVM_LIB_PATH} -L\${LLVM_LIB_PATH}")
          set(CMAKE_BUILD_RPATH "\${LLVM_LIB_PATH}")
          EOF

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=./llvm-toolchain.cmake \
            -DLLVM_INSTALL_PREFIX=${{ env.LLVM_INSTALL_PREFIX }} \
            -DLLVM_LIB_PATH=${{ env.LLVM_LIB_PATH }} \
            -DLLVM_VERSION=${{ env.LLVM_VERSION }} \
            -DLLVM_ARCH=${{ env.LLVM_ARCH }} \
            -G Ninja

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{env.CMAKE_BUILD_TYPE}} \
            -DCMAKE_TOOLCHAIN_FILE=./llvm-toolchain.cmake \
            -G Ninja

      - name: Build (with parallel)
        shell: bash
        run: |
          cmake --build build --parallel $(sysctl -n hw.logicalcpu)

      - name: Test (with parallel)
        shell: bash
        working-directory: ./build
        env:
          CTEST_PARALLEL_LEVEL: $(sysctl -n hw.logicalcpu)
        run: |
          ctest -T test --output-on-failure --stop-on-failure --no-tests=error --verbose
