name: macos_clang_19.1

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CMAKE_BUILD_TYPE: Release
  LLVM_VERSION: "19.1.7"
  TOOLS_DIR: "${HOME}/tools"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create tools directory
        shell: bash
        run: mkdir -p ${{env.TOOLS_DIR}}

      - name: Detect system architecture
        id: detect_arch
        shell: bash
        run: |
          ARCH=$(uname -m)
          [[ "$ARCH" == "arm64" ]] && TARGET_ARCH="ARM64" || TARGET_ARCH="X64"
          echo "LLVM_ARCH=$TARGET_ARCH" >> $GITHUB_ENV
          echo "Detected architecture: $ARCH"

      - name: Download and Install LLVM
        shell: bash
        run: |
          LLVM_DIR="${TOOLS_DIR}/llvm-${{env.LLVM_VERSION}}"
          LLVM_URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${{env.LLVM_VERSION}}/LLVM-${{env.LLVM_VERSION}}-macOS-${{env.LLVM_ARCH}}.tar.xz"

          echo "Downloading LLVM from: $LLVM_URL"
          curl -L -o llvm.tar.xz "$LLVM_URL"

          echo "Extracting LLVM to: $LLVM_DIR"
          mkdir -p "$LLVM_DIR"
          tar -xf llvm.tar.xz --strip-components=1 -C "$LLVM_DIR"

          echo "PATH=$LLVM_DIR/bin:$PATH" >> $GITHUB_PATH
          echo "LLVM_LIB_PATH=$LLVM_DIR/lib" >> $GITHUB_ENV

      - name: Verify LLVM Installation
        shell: bash
        run: clang --version

      - name: Download and Install Ninja
        shell: bash
        run: |
          NINJA_VERSION="1.12.0"
          NINJA_URL="https://github.com/ninja-build/ninja/releases/download/v${NINJA_VERSION}/ninja-mac.zip"
          curl -L -o ninja.zip "$NINJA_URL"
          unzip ninja.zip -d ${{env.TOOLS_DIR}}/ninja
          chmod +x ${{env.TOOLS_DIR}}/ninja/ninja
          echo "${{env.TOOLS_DIR}}/ninja" >> $GITHUB_PATH

      - name: Verify Ninja Installation
        shell: bash
        run: ninja --version

      - name: Download and Install CMake
        shell: bash
        run: |
          CMAKE_VERSION="3.30.0"
          CMAKE_URL="https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-macos-universal.tar.gz"
          curl -L -o cmake.tar.gz "$CMAKE_URL"
          tar -xf cmake.tar.gz -C ${{env.TOOLS_DIR}}
          mv ${{env.TOOLS_DIR}}/cmake-${CMAKE_VERSION}-macos-universal ${{env.TOOLS_DIR}}/cmake-${CMAKE_VERSION}
          echo "${{env.TOOLS_DIR}}/cmake-${CMAKE_VERSION}/CMake.app/Contents/bin" >> $GITHUB_PATH

      - name: Verify CMake Installation
        shell: bash
        run: cmake --version

      - name: Verify LLVM Compiler Path
        shell: bash
        run: |
          echo "LLVM C++ Compiler Path: ${{env.TOOLS_DIR}}/llvm-${{env.LLVM_VERSION}}/bin/clang++"
          ls -l ${{env.TOOLS_DIR}}/llvm-${{env.LLVM_VERSION}}/bin/clang++

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{env.CMAKE_BUILD_TYPE}} \
            -DCMAKE_C_COMPILER=${{env.TOOLS_DIR}}/llvm-${{env.LLVM_VERSION}}/bin/clang \
            -DCMAKE_CXX_COMPILER=${{env.TOOLS_DIR}}/llvm-${{env.LLVM_VERSION}}/bin/clang++ \
            -DCMAKE_AR=${{env.TOOLS_DIR}}/llvm-${{env.LLVM_VERSION}}/bin/llvm-ar \
            -DCMAKE_RANLIB=${{env.TOOLS_DIR}}/llvm-${{env.LLVM_VERSION}}/bin/llvm-ranlib \
            -DCMAKE_LINKER=${{env.TOOLS_DIR}}/llvm-${{env.LLVM_VERSION}}/bin/ld.lld \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++ -fuse-ld=lld" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,-rpath,${{env.TOOLS_DIR}}/llvm-${{env.LLVM_VERSION}}/lib -L${{env.TOOLS_DIR}}/llvm-${{env.LLVM_VERSION}}/lib" \
            -DCMAKE_BUILD_RPATH="${{env.TOOLS_DIR}}/llvm-${{env.LLVM_VERSION}}/lib" \
            -G Ninja

      - name: Build
        shell: bash
        run: |
          cmake --build build --parallel $(sysctl -n hw.logicalcpu)

      - name: Test
        shell: bash
        working-directory: ./build
        run: |
          ctest -T test --output-on-failure --stop-on-failure --no-tests=error --verbose -j $(sysctl -n hw.logicalcpu)
