name: macos_clang_19.1

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CMAKE_BUILD_TYPE: Release
  LLVM_VERSION: "19.1.7"
  TOOLS_DIR: "${HOME}/tools" # 改用用户家目录

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create tools directory
        shell: bash
        run: mkdir -p "${{ env.TOOLS_DIR }}"

      - name: Detect system architecture
        id: detect_arch
        shell: bash
        run: |
          ARCH=$(uname -m)
          [[ "$ARCH" == "arm64" ]] && TARGET_ARCH="ARM64" || TARGET_ARCH="X64"
          echo "LLVM_ARCH=$TARGET_ARCH" >> $GITHUB_ENV

      - name: Download and Install LLVM
        shell: bash
        run: |
          LLVM_URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ env.LLVM_VERSION}}/LLVM-${{ env.LLVM_VERSION}}-macOS-${{ env.LLVM_ARCH}}.tar.xz"
          LLVM_TAR="llvm.tar.xz"
          LLVM_DIR="${{ env.TOOLS_DIR }}/llvm"

          echo "Downloading LLVM from: $LLVM_URL"
          curl -L -o "$LLVM_TAR" "$LLVM_URL"

          echo "Extracting LLVM to: $LLVM_DIR"
          mkdir -p "$LLVM_DIR"
          tar -xf "$LLVM_TAR" --strip-components=1 -C "$LLVM_DIR"

          # 关键检查：确保 clang++ 实际存在
          echo "验证 LLVM 安装:"
          ls -l "$LLVM_DIR/bin/clang++" || exit 1

          # 设置全局环境变量
          echo "LLVM_INSTALL_PREFIX=$LLVM_DIR" >> $GITHUB_ENV
          echo "LLVM_LIB_PATH=$LLVM_DIR/lib" >> $GITHUB_ENV
          echo "$LLVM_DIR/bin" >> $GITHUB_PATH

      - name: Verify LLVM Installation
        shell: bash
        run: |
          echo "LLVM_INSTALL_PREFIX: ${{ env.LLVM_INSTALL_PREFIX }}"
          echo "LLVM_LIB_PATH: ${{ env.LLVM_LIB_PATH }}"
          clang++ --version  # 直接调用应能工作，因为 PATH 已设置

      - name: Configure CMake
        shell: bash
        run: |
          # 使用绝对路径避免环境变量展开问题
          CMAKE_C_COMPILER="${{ env.LLVM_INSTALL_PREFIX }}/bin/clang"
          CMAKE_CXX_COMPILER="${{ env.LLVM_INSTALL_PREFIX }}/bin/clang++"
          CMAKE_AR="${{ env.LLVM_INSTALL_PREFIX }}/bin/llvm-ar"
          CMAKE_LINKER="${{ env.LLVM_INSTALL_PREFIX }}/bin/ld.lld"

          # 打印调试信息
          echo "CMake 编译器路径:"
          echo "C: $CMAKE_C_COMPILER"
          echo "C++: $CMAKE_CXX_COMPILER"
          ls -l "$CMAKE_CXX_COMPILER" || exit 1

          cmake -B build \
            -DCMAKE_BUILD_TYPE="${{ env.CMAKE_BUILD_TYPE }}" \
            -DCMAKE_C_COMPILER="$CMAKE_C_COMPILER" \
            -DCMAKE_CXX_COMPILER="$CMAKE_CXX_COMPILER" \
            -DCMAKE_AR="$CMAKE_AR" \
            -DCMAKE_RANLIB="${{ env.LLVM_INSTALL_PREFIX }}/bin/llvm-ranlib" \
            -DCMAKE_LINKER="$CMAKE_LINKER" \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++ -fuse-ld=lld" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,-rpath,${{ env.LLVM_LIB_PATH }} -L${{ env.LLVM_LIB_PATH }}" \
            -DCMAKE_BUILD_RPATH="${{ env.LLVM_LIB_PATH }}" \
            -G Ninja

      - name: Build
        shell: bash
        run: cmake --build build --parallel $(sysctl -n hw.logicalcpu)

      - name: Test
        shell: bash
        working-directory: ./build
        run: ctest -T test --output-on-failure -j $(sysctl -n hw.logicalcpu)
