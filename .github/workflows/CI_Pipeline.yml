name: Linux G++14 Debug Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CMAKE_BUILD_TYPE: Debug # 改为Debug模式

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          # 合并安装步骤
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get install -y \
            g++-14 \
            ninja-build \
            lcov \
            wget

          # 安装指定版本CMake
          wget -q https://github.com/Kitware/CMake/releases/download/v3.30.0/cmake-3.30.0-linux-x86_64.tar.gz
          tar -xzf cmake-3.30.0-linux-x86_64.tar.gz
          sudo mv cmake-3.30.0-linux-x86_64 /opt/cmake
          sudo ln -sf /opt/cmake/bin/cmake /usr/bin/cmake

      - name: Set Compiler
        run: |
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
          sudo update-alternatives --set g++ /usr/bin/g++-14

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{env.CMAKE_BUILD_TYPE}} \
            -DCMAKE_CXX_FLAGS="--coverage" \  # 添加覆盖率支持
            -G Ninja

      - name: Build & Test
        run: |
          cmake --build build --parallel $(nproc)
          ctest --test-dir build --output-on-failure --verbose

      - name: Generate Coverage
        working-directory: build
        run: |
          lcov --capture --directory . --output-file coverage.info
          lcov --remove coverage.info '/usr/*' '*/test/*' --output-file coverage.info
          genhtml coverage.info --output-directory coverage_report

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4 # 升级到v4版本
        with:
          name: debug-build-artifacts
          path: |
            build/coverage_report/
            build/coverage.info

      - name: Generate Badge
        working-directory: build
        run: |
          # 获取覆盖率百分比
          COVERAGE=$(lcov --summary coverage.info | grep 'lines......:' | grep -oP '\d+\.\d*%' | cut -d'%' -f1)

          # 生成徽章
          curl -s "https://img.shields.io/badge/Coverage-${COVERAGE}%25-$( \
            awk -v c="$COVERAGE" 'BEGIN {print (c >= 90) ? "brightgreen" : (c >= 70) ? "green" : "orange"}')" \
            -o coverage.svg

          # 创建自动提交的目录
          mkdir -p ../badges
          cp coverage.svg ../badges/

      - name: Commit Badge
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add badges/coverage.svg
          git commit -m "Update coverage badge" || echo "No changes to commit"
          git push
