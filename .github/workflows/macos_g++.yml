name: macos_gcc14

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Homebrew
        run: |
          # 卸载系统预装旧版本brew（如有）
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/uninstall.sh)" || true

          # 全新安装到标准路径
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

          # 强制刷新当前shell环境
          eval "$(/opt/homebrew/bin/brew shellenv)"
          echo "BREW_PREFIX=/opt/homebrew" >> $GITHUB_ENV
          echo "$(/opt/homebrew/bin/brew shellenv)" >> $GITHUB_ENV

      - name: Install GCC 14
        run: |
          # 使用绝对路径调用brew
          /opt/homebrew/bin/brew install gcc@14

          # 获取gcc真实安装路径
          GCC_PATH=$(/opt/homebrew/bin/brew --prefix gcc)/bin/gcc-14
          GXX_PATH=$(/opt/homebrew/bin/brew --prefix gcc)/bin/g++-14

          # 写入环境变量
          echo "CC=${GCC_PATH}" >> $GITHUB_ENV
          echo "CXX=${GXX_PATH}" >> $GITHUB_ENV
          echo "PATH=$(/opt/homebrew/bin/brew --prefix gcc)/bin:$PATH" >> $GITHUB_ENV

      - name: Verify Toolchain
        run: |
          ls -l $(which gcc-14)
          ls -l $(which g++-14)
          gcc-14 --version | grep 'gcc'
          g++-14 --version | grep 'g++'

      - name: Install Build Dependencies
        run: |
          /opt/homebrew/bin/brew install cmake ninja pkg-config

      - name: CMake Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DCMAKE_C_COMPILER=${{env.CC}} \
            -DCMAKE_CXX_COMPILER=${{env.CXX}} \
            -DCMAKE_CXX_STANDARD=20 \
            -G Ninja

      - name: Build Project
        run: cmake --build build --parallel $(sysctl -n hw.logicalcpu)

      - name: Run Tests
        working-directory: ./build
        run: ctest --output-on-failure --parallel $(sysctl -n hw.logicalcpu)
