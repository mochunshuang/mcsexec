name: macos_g++_14

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Homebrew
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "$(/opt/homebrew/bin/brew shellenv)" >> $GITHUB_ENV
          source $GITHUB_ENV

      - name: Install GCC 14
        run: |
          brew install gcc@14
          GNU_PATH=$(brew --prefix gcc@14)/bin
          echo "GCC_PATH=$GNU_PATH/gcc-14" >> $GITHUB_ENV
          echo "GXX_PATH=$GNU_PATH/g++-14" >> $GITHUB_ENV
          echo "PATH=$GNU_PATH:$PATH" >> $GITHUB_ENV

      - name: Verify GNU toolchain
        run: |
          which gcc-14
          which g++-14
          g++-14 --version
          gcc-14 --version

      - name: Install Build Tools
        run: brew install cmake ninja

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DCMAKE_C_COMPILER=${{env.GCC_PATH}} \
            -DCMAKE_CXX_COMPILER=${{env.GXX_PATH}} \
            -G Ninja

      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.logicalcpu)

      - name: Test
        working-directory: ./build
        run: ctest --output-on-failure --parallel $(sysctl -n hw.logicalcpu)
