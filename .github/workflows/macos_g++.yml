name: macos_g++_14

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  BUILD_TYPE: Release
  # 设置 GNU 编译器路径变量
  GXX_PATH: /usr/local/bin/g++-14
  GCC_PATH: /usr/local/bin/gcc-14

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Print working directory
        run: pwd

      - name: List files (for debugging)
        run: ls -R

      - name: Install Homebrew (if not exists)
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo 'export PATH="/usr/local/bin:$PATH"' >> ~/.zshrc

      - name: Install GNU g++-14
        run: |
          brew update
          brew install gcc@14
          # 创建明确的版本化符号链接
          ln -sf /usr/local/bin/gcc-14 $GCC_PATH
          ln -sf /usr/local/bin/g++-14 $GXX_PATH

      - name: Verify GNU compiler
        run: |
          $GXX_PATH --version | grep "g++"
          $GCC_PATH --version | grep "gcc"

      - name: Install CMake and Ninja
        run: |
          brew install cmake ninja

      - name: Configure CMake with GNU toolchain
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DCMAKE_C_COMPILER=${{env.GCC_PATH}} \
            -DCMAKE_CXX_COMPILER=${{env.GXX_PATH}} \
            -DCMAKE_CXX_FLAGS="-stdlib=libstdc++" \
            -G Ninja

      - name: Get number of logical cores
        id: get_cores
        run: echo "CORES=$(sysctl -n hw.logicalcpu)" >> $GITHUB_ENV

      - name: Build with parallel
        run: |
          cmake --build ./build \
            --config ${{env.BUILD_TYPE}} \
            --parallel ${{env.CORES}}

      - name: Test with parallel
        working-directory: ./build
        env:
          CTEST_PARALLEL_LEVEL: ${{env.CORES}}
        run: |
          ctest -C ${{env.BUILD_TYPE}} \
            --output-on-failure \
            --verbose
