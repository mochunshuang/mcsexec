name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  BUILD_TYPE: Debug

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 安装完整工具链（关键修改点）
      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y \
            g++-14 \
            gcc-14 \
            gcovr \
            lcov \
            clang-tidy \
            ninja-build

          # 安装匹配的gcov工具
          sudo apt-get install -y gcov-14
          sudo update-alternatives --install /usr/bin/gcov gcov /usr/bin/gcov-14 100
          sudo update-alternatives --set gcov /usr/bin/gcov-14

      # 安装CMake 3.30（优化版）
      - name: Install CMake
        run: |
          wget -q https://github.com/Kitware/CMake/releases/download/v3.30.0/cmake-3.30.0-linux-x86_64.tar.gz
          tar -xzf cmake-3.30.0-linux-x86_64.tar.gz
          sudo mv cmake-3.30.0-linux-x86_64 /opt/cmake
          sudo ln -sf /opt/cmake/bin/cmake /usr/bin/cmake

      # 配置构建参数（关键修改点）
      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-abs-path -fprofile-dir=$(pwd)/coverage" \
            -G Ninja

      # 构建和测试（保持原样）
      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Test
        working-directory: ./build
        run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure --verbose

      # 生成覆盖率报告（关键修改点）
      - name: Generate Coverage
        working-directory: ./build
        run: |
          # 使用gcovr替代lcov
          gcovr --exclude-unreachable-branches \
                --exclude-throw-branches \
                --exclude '/usr/*' \
                --exclude '*/tests/*' \
                --html-details coverage-report.html \
                --xml coverage.xml \
                --print-summary

          # 生成兼容性报告
          lcov --capture --directory . --output-file coverage.info \
               --gcov-tool $(which gcov-14) || echo "lcov completed with warnings"

          lcov --remove coverage.info '/usr/*' '*/tests/*' --output-file filtered.info
          genhtml filtered.info --output-directory legacy-coverage

      # 生成徽章（优化版）
      - name: Generate Badges
        working-directory: ./build
        run: |
          # 从gcovr输出中提取覆盖率
          COVERAGE_PERCENT=$(gcovr --print-summary | grep 'lines:' | awk '{print $2}' | tr -d '%')

          # 动态生成颜色
          COLOR=$(awk -v c=$COVERAGE_PERCENT 'BEGIN {
            if (c >= 90) print "brightgreen";
            else if (c >= 80) print "green";
            else if (c >= 70) print "yellowgreen";
            else if (c >= 60) print "yellow";
            else print "red"
          }')

          curl -s "https://img.shields.io/badge/Coverage-${COVERAGE_PERCENT}%25-${COLOR}" -o coverage.svg
          echo "COVERAGE=${COVERAGE_PERCENT}%" >> $GITHUB_ENV

      # 上传制品（保持原样）
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build/coverage-report.html
            build/legacy-coverage/
            build/coverage.svg

      # 自动提交徽章（优化版）
      - name: Update README
        if: github.ref == 'refs/heads/main' && env.COVERAGE != ''
        run: |
          mkdir -p docs/badges
          cp build/coverage.svg docs/badges/

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add docs/badges/coverage.svg

          # 仅在覆盖率变化时提交
          git diff-index --quiet HEAD || \
          git commit -m "Update coverage to ${COVERAGE}%"
          git push
