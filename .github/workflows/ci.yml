name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  BUILD_TYPE: Debug

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 安装基础工具链
      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-14 lcov clang-tidy

      # 设置编译器
      - name: Set g++-14 as default
        run: |
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
          sudo update-alternatives --set g++ /usr/bin/g++-14

      - name: Install CMake 3.30 (from official binaries)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget https://github.com/Kitware/CMake/releases/download/v3.30.0/cmake-3.30.0-linux-x86_64.tar.gz
          tar -xzf cmake-3.30.0-linux-x86_64.tar.gz
          sudo mv cmake-3.30.0-linux-x86_64 /opt/cmake-3.30.0
          sudo ln -sf /opt/cmake-3.30.0/bin/cmake /usr/bin/cmake

      - name: Install Ninja (Latest Version)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      # 配置带覆盖率检测的构建
      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DCMAKE_CXX_FLAGS="--coverage" \
            -G Ninja

      # 并行构建
      - name: Build
        run: cmake --build build --parallel $(nproc)

      # 运行测试
      - name: Test
        working-directory: ./build
        run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure --verbose

      # 生成覆盖率报告
      - name: Generate Coverage
        working-directory: ./build
        run: |
          lcov --capture --directory . --output-file coverage.info
          lcov --remove coverage.info '/usr/*' '*/tests/*' --output-file coverage.info
          genhtml coverage.info --output-directory coverage-report

      # 代码质量检查
      - name: Code Analysis
        run: |
          find src include -name '*.cpp' -o -name '*.hpp' | xargs clang-tidy -p build

      # 生成徽章数据
      - name: Generate Badges
        working-directory: ./build
        run: |
          # 提取覆盖率百分比
          COVERAGE_PERCENT=$(lcov --summary coverage.info | grep 'lines......:' | awk '{print $2}' | sed 's/%//')
          echo "COVERAGE_PERCENT=${COVERAGE_PERCENT}" >> $GITHUB_ENV

          # 生成徽章图片
          wget "https://img.shields.io/badge/Coverage-${COVERAGE_PERCENT}%25-$( [ $COVERAGE_PERCENT -ge 90 ] && echo brightgreen || echo orange )" -O coverage.svg
          wget "https://img.shields.io/badge/Quality-Passing-brightgreen" -O quality.svg  # 实际项目需要根据检查结果动态生成

      # 发布报告和徽章
      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-reports
          path: |
            build/coverage-report/
            build/coverage.svg
            build/quality.svg

      # 自动提交徽章到README（需授权）
      - name: Update README
        if: github.ref == 'refs/heads/main'
        run: |
          # 复制徽章文件到根目录
          cp -f build/coverage.svg docs/badges/
          cp -f build/quality.svg docs/badges/

          # 提交变更
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add docs/badges/*.svg
          git commit -m "Update CI badges"
          git push
